<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors and Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Colors</h1>

    <div class="palette">

        <div class="color-box named">
            Named Color
        </div>

        <div class="color-box hex">
            HEX
        </div>

        <div class="color-box rgb">
            RGB
        </div>

        <div class="color-box rgba">
            RGBA
        </div>

    </div>

    <h2>Opacity vs RGBA</h2>

    <div class="comparison">

        <div class="opacity-example">
            <h3>Opacity 0.5</h3>
            <p>Child text also becomes transparent.</p>
        </div>

        <div class="rgba-example">
            <h3>RGBA 0.5</h3>
            <p>Child text stays normal.</p>
        </div>

    </div>

</body>
</html>
